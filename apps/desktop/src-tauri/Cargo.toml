[package]
name = "nmesh-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "nmesh desktop client (Tauri shell over nmesh-app)"

# Not part of the root workspace: it needs webkit2gtk / libsoup system libraries.
# Empty table makes this its own workspace root.
[workspace]

[lib]
name = "nmesh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nmesh-app = { path = "../../../crates/nmesh-app" }
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
