# Judge panel for acn-judge (the runner's judges for `judged` conditions, Core.md §7).
#
#   nmesh-acn-sim --judges crates/acn-judge/judges.example.toml
#   cargo run -p acn-judge --example try_panel -- crates/acn-judge/judges.example.toml
#
# model_id, model_version, prompt_template, temperature, max_tokens, seed and json_mode make up
# the judge's fingerprint, which is pinned in the terms: change one and earlier terms no longer
# match (judge_mismatch). endpoint, api_key_env and timeout_secs are not pinned. Use judges from
# different model families.
#
# model_id is exactly the model name sent to the endpoint (there is no separate override), so
# use the provider's dated or tagged name. A reply whose reported `model` isn't model_id (or
# model_id plus a date suffix; see acn_judge::model_matches) fails. model_version is not sent to
# or reported by the provider: it is your assertion, and the harness can't verify it.
#
# Endpoints are OpenAI-compatible chat completions. API keys come from the environment
# variable named in api_key_env, never from this file.

# Two small local models through Ollama (`ollama pull qwen2.5:1.5b`, `ollama pull llama3.2:1b`).
# Fine for trying the flow on a laptop CPU; too small to be trusted judges.
[[judge]]
model_id = "qwen2.5:1.5b"
model_version = "1.5b-instruct-q4_K_M"
endpoint = "http://127.0.0.1:11434/v1"
temperature = 0.0
max_tokens = 600
seed = 7

[[judge]]
model_id = "llama3.2:1b"
model_version = "1b-instruct-q8_0"
endpoint = "http://127.0.0.1:11434/v1"
temperature = 0.0
max_tokens = 600
seed = 7

