# nmesh agent bridge configuration.
#
# Run:   cargo run -p nmesh-agent-bridge --bin nmesh-agent -- --config agent.toml
#
# The bridge is a Nostr *peer* with its own keypair. Humans DM it `/tool args`
# (NIP-CD slash command syntax) and it replies with text or nmesh structured messages.

relays = ["ws://127.0.0.1:7777"]

[agent]
id = "echo"
name = "Echo agent"
about = "Demo agent backed by the echo MCP example."
key_file = ".nmesh/agents/echo.nsec"
# self_hosted | operator | third_party
hosting = "self_hosted"
operator = "me"
retention = "none"
# forwards_to = ["api.example-llm.com"]
# allow = ["npub1..."]

# ACN commitments (docs/Core.md). Tools can be requested as T0 commitments and are answered with
# signed REPORTs; requesters close them with SATISFY / REJECT.
[acn]
enabled = true
price_sat = 0                  # > 0: calls are T1, paid with a hash-locked Cashu token at `mint`
                               #      (and direct `/tool` DMs are refused: tools are paid for)
# mint = "http://127.0.0.1:3338"   # the test mint nmesh-acn-sim hosts
# wallet_dir = ".nmesh/agent-wallet"
# Evidence (Core §9): artifacts and derivation records on Blossom. Dev server: `nmesh blossom`.
# blossom = ["http://127.0.0.1:3400"]
# Evidence disclosure. "private" (the default) uploads nothing: REPORTs carry the inline result
# only and no conformance level is claimed. "public" uploads every tool result, its derivation
# record and logs to the Blossom servers above, UNENCRYPTED, for anyone with the hash; with an
# operator binding and a Blossom server the agent then claims conformance level L0.
evidence = "public"
# Profile N too (conformance level L1): counters that close open conditions (as human checks,
# or from your templates), the requester's counters, rework, disputes of contradicted rejections,
# held-out instances and disqualifiers. Default true; false serves T0/T1 only (L0).
negotiate = true
# Execution journal (what ran, what was sent, what was redeemed), so a restart never repeats
# work. Default: next to the key file.
# journal = ".nmesh/agents/echo.acn-journal.json"
deadline_secs = 600
review_window_secs = 86400
# Self-hosted: issue an operator binding for this agent key so clients see it as accountable.
operator_key_file = ".nmesh/operator.nsec"
binding_days = 30

# MCP server over stdio. The demo server ships with this crate:
#   cargo build -p nmesh-agent-bridge   (builds target/debug/nmesh-echo-mcp)
[[mcp]]
name = "echo"
transport = "stdio"
command = "target/debug/nmesh-echo-mcp"
args = []

# MCP server over streamable HTTP (remove if you don't have one).
[[mcp]]
name = "remote"
transport = "http"
url = "http://127.0.0.1:8000/mcp"
