[package]
name = "nmesh-agent-bridge"
description = "Expose MCP servers as Nostr agents: each bridge is a peer with its own keypair"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nmesh-agent"
path = "src/main.rs"

# Demo MCP server (stdio) used by the quick start and the integration tests.
[[bin]]
name = "nmesh-echo-mcp"
path = "src/bin/nmesh-echo-mcp.rs"

[dependencies]
nmesh-proto.workspace = true
nmesh-contracts.workspace = true
nmesh-core.workspace = true
acn-core.workspace = true
acn-binding.workspace = true
acn-binding-nostr.workspace = true
nmesh-wallet.workspace = true
nmesh-blossom.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "server",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
] }
rustls.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
toml.workspace = true

[dev-dependencies]
nmesh-app.workspace = true
nmesh-mint.workspace = true
nostr-relay-builder.workspace = true
