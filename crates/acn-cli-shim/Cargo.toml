[package]
name = "acn-cli-shim"
description = "A second, independent reference binding (docs/harness-binding-API.md §3): any command-line agent harness (task on stdin, result on stdout, files in an output directory) as an L0 ACN performer. No MCP, no nmesh-agent-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "acn-cli-shim"
path = "src/main.rs"

[dependencies]
acn-core.workspace = true
acn-binding.workspace = true
acn-binding-nostr.workspace = true
nmesh-core.workspace = true
nmesh-proto.workspace = true
nmesh-wallet.workspace = true
nmesh-blossom.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
toml.workspace = true
clap.workspace = true
rustls.workspace = true

[dev-dependencies]
acn-conformance.workspace = true
nmesh-mint.workspace = true
nostr-relay-builder.workspace = true
